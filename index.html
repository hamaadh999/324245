<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2f36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سعراتي">
<link rel="manifest" href="manifest.json">
<title>سعراتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>

<div class="fabwrap"><button class="fab" id="fab" data-a="addfood" aria-label="إضافة طعام"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>إضافة أكل</button></div>

<nav class="nav" id="nav">
  <button data-a="tab" data-tab="today"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>اليوم</button>
  <button data-a="tab" data-tab="foods"><svg class="ic" viewBox="0 0 24 24"><path d="M7 3v7a2 2 0 0 0 2 2v9M11 3v7a2 2 0 0 1-2 2M17 3c-2.2 1.6-3 4-3 6.5 0 1.6 1 2.5 3 2.5v9"/></svg>الأغذية</button>
  <button data-a="tab" data-tab="work"><svg class="ic" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>التمارين</button>
  <button data-a="tab" data-tab="stats"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/></svg>التقدم</button>
  <button data-a="tab" data-tab="set"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>الإعدادات</button>
</nav>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="tst" id="toast"></div>

<!-- ترتيب التحميل مهم: البيانات ثم النواة ثم بقية الوحدات ثم app.js أخيراً -->
<script src="js/foods-data.js"></script>
<script src="js/core.js"></script>
<script src="js/sync.js"></script>
<script src="js/foods.js"></script>
<script src="js/views.js"></script>
<script src="js/sheets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
